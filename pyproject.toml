[project]
name = "data-analyst-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mistralai-agents==1.1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.mistralai.agents]
entrypoint = "main:agent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
